  (function () {
    try {
      var KEY = "amals-cn-locale";
      var stored = localStorage.getItem(KEY);
      var path = location.pathname || "/";
      var onZh = path === "/zh" || path === "/zh/" || path.indexOf("/zh/") === 0;

      function preferZh() {
        var langs = [];
        if (navigator.languages && navigator.languages.length) {
          langs = langs.concat(Array.prototype.slice.call(navigator.languages));
        }
        if (navigator.language) langs.push(navigator.language);
        for (var i = 0; i < langs.length; i++) {
          var x = String(langs[i] || "").toLowerCase();
          if (x.indexOf("zh") === 0) return true;
          if (x.indexOf("en") === 0) return false;
        }
        return false;
      }

      function toZh(p) {
        if (p === "/" || p === "") return "/zh/";
        if (p.indexOf("/zh") === 0) return p.endsWith("/") ? p : p + "/";
        return "/zh" + (p.endsWith("/") ? p : p + "/");
      }

      function toEn(p) {
        if (p === "/zh" || p === "/zh/") return "/";
        if (p.indexOf("/zh/") === 0) {
          var rest = p.slice(3);
          return rest.endsWith("/") ? rest : rest + "/";
        }
        return p.endsWith("/") ? p : p + "/";
      }

      var wantZh = stored === "zh" ? true : stored === "en" ? false : preferZh();
      if (wantZh && !onZh) {
        location.replace(toZh(path));
        return;
      }
      if (!wantZh && onZh && stored === "en") {
        location.replace(toEn(path));
      }
    } catch (e) {}
  })();
