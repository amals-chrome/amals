    function isLocale(v) { return v === "en" || v === "zh"; }

    }

    function writeStored(locale) {
        if (!isLocale(locale)) return;
        try { localStorage.setItem(LOCALE_KEY, locale); } catch (e) {}

            var v = new URLSearchParams(location.search).get("lang");

        } catch (e) { return null; }
    }

    /** ?lang= → use + write; no param → read storage / default, never write */
    function resolveLocale() {

            docItems.push({ el: li, id: id });
        })(i);
    }
    doclist.appendChild(ul);

    function applyUi() {
        var m = messages[locale] || messages.en;

        document.getElementById("langEn").classList.toggle("active", locale === "en");
        document.getElementById("langZh").classList.toggle("active", locale === "zh");
        btnEls.forEach(function (btn) {

            btn.textContent = m.btns[idx];
        });
        docItems.forEach(function (item) {
            item.el.textContent = m.docItem.replace("{n}", String(item.id));
        });
    }

    document.getElementById("langEn").onclick = function () {
        if (locale === "en") return;
        locale = "en";
        setLocale("en");
        applyUi();
    };
    document.getElementById("langZh").onclick = function () {

    window.onkeydown = function (event) {

        if (e && e.keyCode === 39) window.__filen__sdk.nextStep();
    };
})();</script></html>
