<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Amals">
  <defs>
    <linearGradient id="tile" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="body" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="flame" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#tile)"/>

  <!-- slight tilt group -->
  <g transform="translate(32 33) rotate(-28) translate(-32 -33)">
    <!-- flame -->
    <path
      fill="url(#flame)"
      d="M32 48c3.2 0 5.2 3.2 5.2 6.2 0 2.6-2.2 4.8-5.2 6.3-3-1.5-5.2-3.7-5.2-6.3 0-3 2-6.2 5.2-6.2z"
    />
    <path
      fill="#fff7ad"
      opacity="0.9"
      d="M32 50.2c1.7 0 2.8 1.8 2.8 3.5 0 1.5-1.2 2.8-2.8 3.7-1.6-.9-2.8-2.2-2.8-3.7 0-1.7 1.1-3.5 2.8-3.5z"
    />

    <!-- fins -->
    <path fill="url(#fin)" d="M22.5 38.5 L28.5 33.2 L28.5 42.8 Z"/>
    <path fill="url(#fin)" d="M41.5 38.5 L35.5 33.2 L35.5 42.8 Z"/>

    <!-- body -->
    <path
      fill="url(#body)"
      d="M32 11c5.6 0 9.2 8.4 9.2 18.2 0 6.2-1.6 12.8-4.2 16.6H27c-2.6-3.8-4.2-10.4-4.2-16.6C22.8 19.4 26.4 11 32 11z"
    />

    <!-- window -->
    <circle cx="32" cy="26" r="4.4" fill="#a855f7"/>
    <circle cx="32" cy="26" r="2.5" fill="#ffffff" opacity="0.92"/>
    <circle cx="30.8" cy="24.9" r="0.85" fill="#ffffff" opacity="0.7"/>

    <!-- tip accent -->
    <path fill="#f472b6" d="M32 11c2.4 0 4.2 2.2 4.8 5.2h-9.6C28 13.2 29.6 11 32 11z"/>
  </g>
</svg>
